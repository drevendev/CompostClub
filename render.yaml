# Optional static frontend only. Does not host or expose local Ollama.
services:
  - type: web
    name: compost-club
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
