name: Feature or documentation request
description: Explain a user need or an unclear step.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the user need and current obstacle, using fictional examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: What should change, and how would we know it helped?
    validations:
      required: true
